<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #080d0c;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #f7faf8;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
      }

      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }

      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .scene {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 100px 144px;
        background:
          radial-gradient(ellipse at 82% 17%, rgba(13, 148, 136, 0.18), transparent 32%),
          #080d0c;
      }

      .scene::before {
        position: absolute;
        inset: 56px;
        border: 1px solid rgba(233, 244, 239, 0.12);
        content: "";
        pointer-events: none;
      }

      .scene-index {
        position: absolute;
        right: 180px;
        bottom: 118px;
        color: rgba(233, 244, 239, 0.72);
        font-family: "Space Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.12em;
      }

      .eyebrow {
        color: #68d3c7;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .display {
        font-size: 134px;
        font-weight: 900;
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      .accent {
        color: #68d3c7;
      }

      .rule {
        display: block;
        width: 460px;
        height: 8px;
        margin-top: 44px;
        border-radius: 8px;
        background: #0d9488;
        transform-origin: left center;
      }

      .signature {
        position: absolute;
        top: 102px;
        right: 154px;
        color: #d9e4e0;
        font-family: "Space Mono", monospace;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.08em;
      }

      .ambient-ring {
        position: absolute;
        top: 245px;
        right: 175px;
        width: 380px;
        height: 380px;
        border: 1px solid rgba(104, 211, 199, 0.34);
        border-radius: 50%;
      }

      .ambient-ring::after {
        position: absolute;
        inset: 30px;
        border: 1px solid rgba(104, 211, 199, 0.18);
        border-radius: inherit;
        content: "";
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        max-width: 1240px;
      }

      .range-layout {
        position: relative;
        z-index: 1;
      }

      .range-heading {
        max-width: 1250px;
        margin-top: 28px;
        font-size: 78px;
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 1.04;
      }

      .range-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
        margin-top: 74px;
      }

      .range-item {
        min-height: 190px;
        padding: 28px 30px;
        border: 1px solid rgba(232, 245, 240, 0.32);
        background: rgba(255, 255, 255, 0.035);
      }

      .range-number {
        color: #68d3c7;
        font-family: "Space Mono", monospace;
        font-size: 19px;
      }

      .range-name {
        margin-top: 20px;
        font-size: 41px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .work-layout {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 0.72fr 1.28fr;
        align-items: center;
        gap: 72px;
      }

      .work-title {
        max-width: 600px;
        margin-top: 26px;
        font-size: 65px;
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 1.05;
      }

      .work-description {
        max-width: 510px;
        margin-top: 26px;
        color: #d2dcd8;
        font-size: 25px;
        line-height: 1.5;
      }

      .work-stat {
        margin-top: 36px;
        color: #68d3c7;
        font-size: 29px;
        font-weight: 800;
      }

      .browser {
        overflow: hidden;
        border: 2px solid rgba(232, 245, 240, 0.3);
        border-radius: 18px;
        background: #f6faef;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.52);
      }

      .browser-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        padding: 0 18px;
        background: #10201c;
      }

      .browser-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #68d3c7;
      }

      .browser-label {
        margin-left: 10px;
        color: #dbe8e2;
        font-family: "Space Mono", monospace;
        font-size: 16px;
      }

      .work-image {
        display: block;
        width: 100%;
        height: auto;
      }

      .closing {
        align-items: flex-start;
      }

      .closing-content {
        position: relative;
        z-index: 1;
      }

      .closing-mark {
        color: #68d3c7;
        font-family: "Space Mono", monospace;
        font-size: 32px;
        font-weight: 700;
      }

      .closing-title {
        max-width: 1250px;
        margin-top: 30px;
        font-size: 142px;
        font-weight: 900;
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      .closing-cta {
        display: inline-flex;
        margin-top: 46px;
        padding: 18px 28px;
        border: 2px solid #68d3c7;
        border-radius: 8px;
        color: #f7faf8;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .closing-cta span {
        margin-left: 18px;
        color: #68d3c7;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-dcwt"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene-one-slot" data-hf-id="hf-i0tr" data-composition-id="scene-one" data-composition-src="compositions/scene-one.html" data-start="0" data-duration="3.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="scene-two-slot" data-hf-id="hf-qez4" data-composition-id="scene-two" data-composition-src="compositions/scene-two.html" data-start="3.5" data-duration="4.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="scene-three-slot" data-hf-id="hf-sdnd" data-composition-id="scene-three" data-composition-src="compositions/scene-three.html" data-start="8" data-duration="5.5" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="scene-four-slot" data-hf-id="hf-62j6" data-composition-id="scene-four" data-composition-src="compositions/scene-four.html" data-start="13.5" data-duration="4.5" data-track-index="0" data-width="1920" data-height="1080"></div>

      <audio data-hf-id="hf-rau1"
        id="music-bed"
        src="assets/audio/soundtrack.mp3"
        data-start="0"
        data-duration="18"
        data-track-index="4"
        data-volume="0.25"
      ></audio>
      <audio data-hf-id="hf-glks"
        id="headline-accent"
        src="assets/sfx/interface/click_003.ogg"
        data-start="1.15"
        data-track-index="5"
        data-volume="0.36"
      ></audio>
      <audio data-hf-id="hf-heg6"
        id="work-accent"
        src="assets/sfx/impact/impactSoft_medium_001.ogg"
        data-start="8.45"
        data-track-index="6"
        data-volume="0.42"
      ></audio>
      <audio data-hf-id="hf-ppwg"
        id="closing-accent"
        src="assets/sfx/impact/impactSoft_medium_001.ogg"
        data-start="16.1"
        data-track-index="7"
        data-volume="0.46"
      ></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
