<!doctype html>
<html lang="en">
  <body>
    <template>
      <div id="scene-one-root" data-composition-id="scene-one" data-width="1920" data-height="1080">
        <section id="scene-one" class="clip scene">
          <div data-hf-id="hf-0ggm" class="ambient-ring" aria-hidden="true"></div>
          <p data-hf-id="hf-vain" class="signature">J/DEV</p>
          <div data-hf-id="hf-jloi" class="hero-copy">
            <p data-hf-id="hf-athk" class="eyebrow">A portfolio in three parts</p>
            <h1 data-hf-id="hf-su74" class="display">
              <span data-hf-id="hf-9zxx" id="word-designer">Designer.</span><br data-hf-id="hf-x5px" />
              <span data-hf-id="hf-xl24" id="word-developer" class="accent">Developer.</span>
            </h1>
            <span data-hf-id="hf-in3p" id="headline-rule" class="rule" aria-hidden="true"></span>
          </div>
          <p data-hf-id="hf-5a9w" class="scene-index">01 / 04</p>
        </section>
      </div>
      <script>
        const root = document.getElementById("scene-one-root");
        const select = gsap.utils.selector(root);
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(select(".signature"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.1);
        tl.fromTo(select(".eyebrow"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
        tl.fromTo(select("#word-designer"), { opacity: 0, x: -76 }, { opacity: 1, x: 0, duration: 0.72, ease: "power3.out" }, 0.38);
        tl.fromTo(select("#word-developer"), { opacity: 0, x: 88 }, { opacity: 1, x: 0, duration: 0.72, ease: "back.out(1.3)" }, 1.05);
        tl.fromTo(select("#headline-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.48, ease: "power2.inOut" }, 2.02);
        tl.to(select(".ambient-ring"), { scale: 1.045, opacity: 0.72, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
        window.__timelines["scene-one"] = tl;
      </script>
    </template>
  </body>
</html>
